<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function longestPalindrome(s) {
        const n = s.length
        if (n < 2) return s

        // dp[i][j] 表示 s[i..j] 是否是回文
        const dp = Array.from({ length: n }, () => Array(n).fill(false))

        let start = 0
        let maxLen = 1

        // 1. 单个字符是回文
        for (let i = 0; i < n; i++) {
          dp[i][i] = true
        }

        // 2. 从短串到长串开始填表
        for (let i = n - 1; i >= 0; i--) {
          for (let j = i + 1; j < n; j++) {
            // 如果首尾字符相同才有继续判断的必要
            if (s[i] === s[j]) {
              // ① 长度为 2 的子串
              if (j - i === 1) {
                dp[i][j] = true
              } else {
                // ② 长度 >= 3 的子串看中间
                dp[i][j] = dp[i + 1][j - 1]
              }
            } else {
              dp[i][j] = false
            }

            // 如果是回文且长度更长，就更新答案
            if (dp[i][j] && j - i + 1 > maxLen) {
              maxLen = j - i + 1
              start = i
            }
          }
        }

        return s.substring(start, start + maxLen)
      }
      console.log(longestPalindrome('babad'))
    </script>
  </body>
</html>
