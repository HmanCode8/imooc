<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/car.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/iconFonts/iconfont.css" />
    <script type="text/javascript" src="/static/iconFonts/iconfont.js"></script>
    <title>无人车监管服务平台</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- 根据环境引入不同的配置文件 -->
    <script type="module">
      const globalConfigUrl = import.meta.env.VITE_CONFIG_URL;
      const configList = [
        globalConfigUrl,
      ];
      // 加载配置脚本
      const loadConfigScript = new Promise((resolve) => {
        configList.forEach((url) => {
          const script = document.createElement('script');
          script.type = 'text/javascript';
          script.src = url;
          script.onload = resolve; // 确保加载完成后再执行下一步
          document.head.appendChild(script);
        });
      });

      // 等待配置加载完成后再启动主脚本
      loadConfigScript.then(() => {
        document.title = window.global_config?.system?.title || '大数据可视化展平台'
        setTimeout(() => {
          import('/src/main.js');
        }, 10);
      });
    </script>
  </body>
</html>
